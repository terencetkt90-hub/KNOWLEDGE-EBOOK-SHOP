<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cart</title>

<style>
body {
    background-color: #BFEFFF;
    font-family: Candara, sans-serif;
}

table, th, td {
    border: 2px solid black;
    border-collapse: collapse;
}

img {
    max-width: 100%;
    height: auto;
}

.logo {
    text-align: center;
}

.logo img {
    width: 220px;
    height: auto;
}

.menu table {
    margin: auto;
}

.menu a {
    font-family: Verdana, sans-serif;
    background-color: #795548;
    color: white;
    padding: 15px 40px;
    text-align: center;
    text-decoration: none;
    display: inline-block;
}

.menu a:hover {
    background-color: #000000;
}

#cart-box {
    position: fixed;
    top: 20px;
    right: 30px;
    font-size: 40px;
    font-weight: bold;
    font-family: Verdana, sans-serif;
    background-color: white;
    border: 3px solid #795548;
    border-radius: 15px;
    padding: 10px 20px;
    box-shadow: 3px 3px 10px gray;
    z-index: 999;
    color: black;
}

.cart-link {
    background: none;
    text-decoration: none;
    color: black;
    padding: 0;
}

.banner-title {
    background-color: #795548;
    color: white;
    font-family: Constantia, serif;
    text-align: center;
    padding: 15px;
    overflow: hidden;
    font-size: 60px;
}

.moving-text {
    white-space: nowrap;
    display: inline-block;
    animation: moveText 10s linear infinite;
}

@keyframes moveText {
    from {
        transform: translateX(100%);
    }

    to {
        transform: translateX(-100%);
    }
}

.section-title {
    background-color: #795548;
    color: white;
    text-align: center;
    padding: 10px;
    font-family: Verdana, sans-serif;
}

.cart-table {
    width: 100%;
    background-color: white;
}

.cart-table th {
    background-color: #D7CCC8;
}

.cart-table td {
    text-align: center;
    padding: 10px;
}

.quantity-box {
    width: 60px;
}

footer {
    background-color: #795548;
    padding: 20px;
    margin-top: 50px;
    color: white;
}

.footer-box {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.footer-text {
    margin: auto;
    font-family: Verdana, sans-serif;
    font-size: 20px;
}

.footer-social {
    display: flex;
    gap: 15px;
}

.footer-social a {
    background: none;
    padding: 0;
}

.footer-social img {
    width: 40px;
    height: 40px;
}

@media screen and (max-width: 768px) {
    .menu table,
    .menu tr,
    .menu td {
        display: block;
        width: 100%;
    }

    .menu a {
        display: block;
        margin: 5px;
    }

    #cart-box {
        position: static;
        margin: 10px auto;
        text-align: center;
        font-size: 25px;
        width: fit-content;
    }

    .banner-title {
        font-size: 35px;
    }
}
</style>
</head>

<body>

<div class="logo">
<img src="Knowledgeebookshop.jpg" alt="Knowledge Ebook Shop Logo">
</div>

<div class="menu">
<table>
<tr>
<td><a href="index.html">Home</a></td>
<td><a href="Shop.html">Shop</a></td>
<td><a href="E-bookdetails.html">E-book Details</a></td>
<td><a href="AboutUs.html">About Us</a></td>
<td><a href="ContactUs.html">Contact Us</a></td>
</tr>
</table>
</div>

<a href="Cart.html" class="cart-link">
<div id="cart-box">
🛒 Cart:
<span id="cart-count">0</span>
</div>
</a>

<h1 class="banner-title">
<span class="moving-text">
Checkout
</span>
</h1>

<h2 class="section-title">Shopping Cart</h2>

<table class="cart-table">
<thead>
<tr>
<th>Book Title</th>
<th>Price</th>
<th>Quantity</th>
<th>Total</th>
<th>Remove</th>
</tr>
</thead>

<tbody id="cart-table">
</tbody>

<h2 class="section-title">Total Payment</h2>

<table class="cart-table">
<tr>
    <th>Total Amount</th>
    <th>Payment</th>
</tr>

<tr>
    <td id="grand-total">$0.00</td>
    <td>

<button onclick="payByCard()">
Pay by Debit/Credit Card
</button>

<br><br>

<button onclick="payByPayNow()">
Pay by PayNow
</button>

</td>
</tr>
</table>

<footer>
<div class="footer-box">

<div class="footer-text">
© Copyrights 2026 | All Rights Reserved
</div>

<div class="footer-social">

<a href="https://www.facebook.com" target="_blank">
<img src="facebooklogo.png" alt="Facebook">
</a>

<a href="https://www.instagram.com" target="_blank">
<img src="instagramlogo.png" alt="Instagram">
</a>

</div>

</div>
</footer>

<script>
let cart = JSON.parse(sessionStorage.getItem("cartItems")) || [];
document.getElementById("cart-count").innerHTML = cart.length;

let table = document.getElementById("cart-table");

cart.forEach(function(book, index) {
    table.innerHTML += `
    <tr>
        <td>${book.title}</td>
        <td>$${Number(book.price).toFixed(2)}</td>
        <td>
            <input
            type="number"
            value="1"
            min="1"
            class="quantity-box"
            onchange="updateTotal()">
        </td>
        <td class="item-total">
            $${Number(book.price).toFixed(2)}
        </td>
        <td>
            <button onclick="removeBook(${index})">Remove</button>
        </td>
    </tr>
    `;
});

updateTotal();

function updateTotal() {

    let rows =
    document.querySelectorAll("#cart-table tr");

    let grandTotal = 0;

    rows.forEach(function(row, index) {

        let price =
        Number(cart[index].price);

        let quantity =
        Number(row.querySelector("input").value);

        let total = price * quantity;

        row.querySelector(".item-total").innerHTML =
        "$" + total.toFixed(2);

        grandTotal += total;
    });

    document.getElementById("grand-total").innerHTML =
    "$" + grandTotal.toFixed(2);
}

function removeBook(index) {
    cart.splice(index, 1);
    sessionStorage.setItem("cartItems", JSON.stringify(cart));
    location.reload();
}

function payByCard() {

    updateTotal();

    window.open(
    "https://www.visa.com.sg/pay-with-visa/find-a-card/credit-cards.html",
    "_blank"
    );
}

function payByPayNow() {

    updateTotal();

    window.open(
    "https://www.abs.org.sg/e-payments/pay-now",
    "_blank"
    );
}


</script>

</body>
</html>
